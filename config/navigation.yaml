map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""
amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /husky_nav/mapping_scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    min_particles: 500
    max_particles: 1500
    max_beams: 90
    laser_min_range: 0.1
    laser_max_range: 12.0
    laser_likelihood_max_dist: 2.0
    update_min_d: 0.1
    update_min_a: 0.05
    transform_tolerance: 0.5
    tf_broadcast: true
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    z_hit: 0.5
    z_rand: 0.5
    z_short: 0.0
    z_max: 0.0
    sigma_hit: 0.2
    do_beamskip: false
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /husky_link/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    default_nav_to_pose_bt_xml: ""
    navigators: [navigate_to_pose]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.15
      use_astar: true
      allow_unknown: false
controller_server:
  ros__parameters:
    use_sim_time: false
    enable_stamped_cmd_vel: true
    odom_topic: /husky_link/odom
    controller_frequency: 10.0
    costmap_update_timeout: 0.4
    failure_tolerance: 0.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
      movement_time_allowance: 30.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.2
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.05
      min_approach_linear_velocity: 0.02
      approach_velocity_scaling_dist: 0.5
      lookahead_dist: 0.7
      min_lookahead_dist: 0.4
      max_lookahead_dist: 0.8
      use_velocity_scaled_lookahead_dist: false
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 2.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.5
      regulated_linear_scaling_min_speed: 0.02
      use_cost_regulated_linear_velocity_scaling: false
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.15
      rotate_to_heading_min_angle: 0.4
      max_angular_accel: 0.5
      allow_reversing: false
      transform_tolerance: 0.1
      stateful: true
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      update_frequency: 5.0
      publish_frequency: 2.0
      track_unknown_space: false
      plugins: [obstacle_layer, vision_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: mapping_scan
        mapping_scan:
          topic: /husky_nav/mapping_scan
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: false
          obstacle_max_range: 4.0
          raytrace_max_range: 4.5
          obstacle_min_range: 0.1
          raytrace_min_range: 0.1
          max_obstacle_height: 3.0
      vision_layer:
        plugin: husky_vision_nav2::VisionMaskLayer
        mask_topic: /husky_nav/vision_mask
        timeout_sec: 0.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.8
        cost_scaling_factor: 3.0
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      update_frequency: 2.0
      publish_frequency: 1.0
      track_unknown_space: true
      plugins: [static_layer, obstacle_layer, vision_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: mapping_scan
        mapping_scan:
          topic: /husky_nav/mapping_scan
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: false
          obstacle_max_range: 4.0
          raytrace_max_range: 4.5
          obstacle_min_range: 0.1
          raytrace_min_range: 0.1
          max_obstacle_height: 3.0
      vision_layer:
        plugin: husky_vision_nav2::VisionMaskLayer
        mask_topic: /husky_nav/vision_mask
        timeout_sec: 0.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.8
        cost_scaling_factor: 3.0
      always_send_full_costmap: true
